name: Feedback

# Creates or updates the FEEDBACK.md files of the assignments. All steps live
# in the action of the public central repository nimblescape/course-feedback
# (action.yml); its config.yml on main decides which agent engine and model
# run. The course module @nimblescape/course (command cs) reads the course and
# writes FEEDBACK.md. The tag v1 always names the newest release 1.x.y of the
# action, so a compatible update needs no change of this file.
#
# Students cannot change FEEDBACK.md: the organisation ruleset lets only its
# bypass actors push it, and GITHUB_TOKEN cannot be one. The action therefore
# pushes with the secret FEEDBACK_PUSH_TOKEN, a fine-grained token of an
# organisation admin (see the README of course-feedback); without the secret
# it uses GITHUB_TOKEN.
#
#   push      assignments whose workspace/ changed, then those with outdated feedback
#   schedule  nightly safety net: student work whose FEEDBACK.md is missing or outdated
#   manual    every assignment with student work (or the chosen mode)
on:
  push:
    branches-ignore:
      - "sync-from-template-*"
      - "sync-from-*"
    paths:
      - "20-assignments/**/workspace/**"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "changed, missing or all"
        default: all
        type: choice
        options: [all, missing, changed]

permissions:
  contents: write

concurrency:
  group: feedback-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Feedback
        uses: nimblescape/course-feedback@v1
        with:
          mode: ${{ inputs.mode }}
          copilot-github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          push-token: ${{ secrets.FEEDBACK_PUSH_TOKEN }}
