# Texts of the feedback program for courses with `language: en` in
# .course/course.yml. The course module (`cs feedback`) writes FEEDBACK.md with
# its own fixed texts; the program gives it these reasons when the work does
# not run.

# Reasons of the automatic checks for "does not run"
reasons:
  typecheck: the type check reports errors
  syntax: a JavaScript file has a syntax error
  build: "`npm run build` reports errors"
  crash: the program stops with an error in the example run
  timeout: the program does not end in the example run
  no-page: "`index.html` is missing"
  no-stylesheet: the stylesheet is not linked
