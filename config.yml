# Central switch for every course feedback run.
#
# The course workflow reads this file from the main branch at every run, so a
# change here applies to all courses and all student repositories at their next
# run – no release needed.

# false stops all feedback runs (for example when the budget is used up).
enabled: true

# Agent engine: the name of a file in engines/ (copilot, claude-code).
# copilot runs the GitHub Copilot CLI and is billed through the Copilot account
# of the COPILOT_GITHUB_TOKEN secret. claude-code runs Claude Code on the Claude
# Max plan of the CLAUDE_CODE_OAUTH_TOKEN secret.
engine: copilot

# Model per engine, with its exact name as the engine knows it (no alias such
# as `sonnet`, which changes when a new model comes out). A mid-tier model is
# enough: the scripts do all mechanical work and the model only judges.
models:
  copilot: claude-sonnet-5.5
  claude-code: claude-sonnet-5-5

# Exact versions of the engine CLIs and of Node.js, so that every run uses the
# same tools. The tools of the automatic checks (TypeScript, html-validate) are
# pinned in the package-lock.json files next to the check scripts in skills/.
versions:
  node: "26" # major version, the same as in the course devcontainers
  # The version of the npm package @nimblescape/course whose command reads the
  # courses and writes FEEDBACK.md (it runs with npx), or a commit of
  # nimblescape/course-vscode for a version that is not on npm.
  course: a457d1bb7297d483c6999e222abf7eebca2d731f
  copilot: 1.0.103
  claude-code: 2.1.310

# At most this many assignments get feedback in one run; the others are skipped
# in that run (the nightly run catches assignments without feedback).
max_assignments_per_run: 20

# Optional settings per course id (the "course" in the course repository's
# .course/course.yml). Each key replaces the value above for that course.
courses: {}
